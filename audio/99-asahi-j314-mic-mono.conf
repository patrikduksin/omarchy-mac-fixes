# Keep the packaged J314 speaker DSP. Use the local microphone graph so its
# processed output has a standard MONO channel instead of AUX0.

override.node.software-dsp.rules = [
  {
    matches = [
      { api.alsa.path = "hw:AppleJ314,1" }
    ]
    actions = {
      create-filter = {
        filter-path = "/usr/share/asahi-audio/j314/graph.json"
        hide-parent = true
      }
    }
  }
  {
    matches = [
      { api.alsa.path = "hw:AppleJ314HPAI,0" }
    ]
    actions = {
      create-filter = {
        filter-path = "@MIC_FILTER_PATH@"
        hide-parent = true
      }
    }
  }
]
